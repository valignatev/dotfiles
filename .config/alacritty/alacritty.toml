# family = "Hack"
# 
# # Colors (Queen's Gardens - Hollow Knight)
# [colors.primary]
# background = '#0A1A1A'
# foreground = '#C4E3DC'
# 
# # Normal colors
# [colors.normal]
# black   = '#1D3637'
# red     = '#FF7A8F'  # Soft pink-red for a bit of contrast
# green   = '#7EDDC6'  # Vibrant aqua-green like the glowing plants
# yellow  = '#E3F5B8'  # Pale yellow-green like the light particles
# blue    = '#6BCCB5'  # Turquoise like the background foliage
# magenta = '#C49AE5'  # Purple for some variety
# cyan    = '#88E2D3'  # Bright cyan like the foreground plants
# white   = '#D4F0EB'
# 
# # Bright colors
# [colors.bright]
# black   = '#4D6E6D'
# red     = '#FF9CAC'  # Brighter pink-red
# green   = '#98F5DE'  # Brighter aqua-green
# yellow  = '#F0FFD0'  # Brighter yellow-green
# blue    = '#8CE2CB'  # Brighter turquoise
# magenta = '#DCB5FF'  # Brighter purple
# cyan    = '#A8FFF0'  # Brighter cyan
# white   = '#E4FFFA'
[bell]
animation = "EaseOutExpo"
duration = 0

[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "0x002b36"
blue = "0x839496"
cyan = "0x93a1a1"
green = "0x586e75"
magenta = "0x6c71c4"
red = "0xcb4b16"
white = "0xfdf6e3"
yellow = "0x657b83"

[colors.normal]
black = "0x073642"
blue = "0x268bd2"
cyan = "0x2aa198"
green = "0x859900"
magenta = "0xd33682"
red = "0xdc322f"
white = "0xeee8d5"
yellow = "0xb58900"

[colors.primary]
background = "0xfdf6e3"
foreground = "0x586e75"

[cursor]
style = "Block"
unfocused_hollow = true

[font]
size = 11.0

[font.bold]
family = "Hack"

[font.italic]
family = "Hack"

[font.normal]
family = "Hack"

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[scrolling]
history = 10000
multiplier = 3

[window.dimensions]
columns = 80
lines = 24
